[workspace]
resolver = "2"
members = [
    "glimpse-shell",   # Shell Extension DLL (IPreviewHandler COM)
    "glimpse-app",    # Preview window binary
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["yujiajunn"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows FFI
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
windows-core = "0.58"

# Decoders
image = { version = "0.25", default-features = false, features = ["default-formats"] }
pdfium-render = "0.8"
# ffmpeg 用于视频音频探针（时长 + 缩略图）。用 build feature 让 ffmpeg-sys-next
# 编译 ffmpeg 源码（避免依赖系统 ffmpeg + pkg-config，CI 干净环境里这俩都没有）
ffmpeg-next = { version = "7", default-features = false, features = ["build", "format", "codec", "software-scaling"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"