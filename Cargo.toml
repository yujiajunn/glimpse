[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/ipreviewhandler",
    "crates/preview-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["you"]
license = "MIT"
repository = "local"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
mime = "0.3"
uuid = { version = "1", features = ["v4"] }

# Windows-specific
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
] }
windows-core = "0.58"

# Preview pipelines
pdfium-render = "0.8"
# image crate：要 PNG/JPEG/GIF/WebP/BMP/AVIF（系统 codec）但不依赖 libheif
image = { version = "0.25", default-features = false, features = ["default-formats", "avif"] }

# Office / Font / Archive
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
ttf-parser = "0.25"
walkdir = "2"

# Cache
sled = "0.34"
postcard = { version = "1", features = ["alloc"] }

# Frontend build
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"