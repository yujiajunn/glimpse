[workspace]
resolver = "2"
members = [
    "glimpse-shell",   # Shell Extension DLL (IPreviewHandler COM)
    "glimpse-app",    # Preview window binary
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["yujiajunn"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows FFI
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
windows-core = "0.58"

# Decoders
image = { version = "0.25", default-features = false, features = ["default-formats"] }
pdfium-render = "0.8"
# 视频/音频：用 Windows 系统默认播放器（mstv.exe / wmplayer.exe 等）
# 避免 ffmpeg-sys-next 在 CI 上编译（pkg-config / nasm 等缺）

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"