name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ci-npm-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node deps
        working-directory: ui
        run: npm install

      - name: cargo check
        run: cargo check --workspace --all-targets --message-format=human 2>&1 | tail -200

      - name: cargo clippy (warning only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --message-format=short -- -W warnings