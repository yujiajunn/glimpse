name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag like v0.1.0"
        required: false

permissions:
  contents: write

jobs:
  # ================================================================
  # 主程序 + 安装包
  # ================================================================
  app:
    name: App (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: npm-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-

      - name: Install Node deps
        working-directory: ui
        run: npm ci || npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-installer-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # ================================================================
  # Shell Extension DLL（x86 + x64 双架构）
  # ================================================================
  shell-dll:
    name: Shell DLL (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: crates-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: crates-cargo-${{ matrix.target }}-

      - name: Build DLL
        working-directory: crates/ipreviewhandler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename DLL
        shell: bash
        run: |
          cd crates/ipreviewhandler/target/${{ matrix.target }}/release
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            mv seer_ipreviewhandler.dll glimpse_previewhandler_x64.dll || true
            mv glimpse_ipreviewhandler.dll glimpse_previewhandler_x64.dll
          else
            mv glimpse_ipreviewhandler.dll glimpse_previewhandler_x86.dll
          fi
          ls -la *.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-shell-dll-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'x86' }}
          path: crates/ipreviewhandler/target/${{ matrix.target }}/release/glimpse_previewhandler_*.dll

  # ================================================================
  # 发布到 GitHub Release
  # ================================================================
  release:
    name: Release
    needs: [app, shell-dll]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dll
          generate_release_notes: true
          draft: false
          prerelease: false