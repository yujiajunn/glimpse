name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: App (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - run: cargo build --release --target ${{ matrix.target }} --bin glimpse 2>&1 | tee /tmp/app_build.log
        continue-on-error: true

      - name: Upload app build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log-${{ matrix.arch }}
          path: /tmp/app_build.log

  shell-dll:
    name: Shell DLL (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            glimpse-shell -> glimpse-shell/target
      - working-directory: glimpse-shell
        run: cargo build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/dll_build.log
        continue-on-error: true

      - name: Upload DLL build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dll-build-log-${{ matrix.arch }}
          path: /tmp/dll_build.log

  release:
    name: Release
    needs: [app, shell-dll]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dll
          generate_release_notes: true
