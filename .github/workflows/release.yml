name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================================================================
  # 主程序 + 安装包
  # ================================================================
  app:
    name: App (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: app-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: app-cargo-${{ matrix.target }}-

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Node deps
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (no bundle, just exe)
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --no-bundle

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-exe-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/glimpse.exe

  # ================================================================
  # Shell Extension DLL（x86 + x64）
  # ================================================================
  shell-dll:
    name: Shell DLL (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dll-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: dll-cargo-${{ matrix.target }}-

      - name: Build DLL
        working-directory: crates/ipreviewhandler
        run: cargo build --release --target ${{ matrix.target }} --verbose 2>&1 | tail -100

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: shell-dll-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'x86' }}
          path: crates/ipreviewhandler/target/${{ matrix.target }}/release/glimpse_previewhandler.dll

  # ================================================================
  # 发布到 GitHub Release
  # ================================================================
  release:
    name: Release
    needs: [app, shell-dll]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dll
          generate_release_notes: true
          draft: false
          prerelease: false